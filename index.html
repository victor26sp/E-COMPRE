<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - E-COMPRE Sistema de Estoque</title>
  <!-- Favicon -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='%230d6efd' class='bi bi-cart' viewBox='0 0 16 16'%3E%3Cpath d='M0 1.5A.5.5 0 0 1 .5 1h1.11l.401 1.607L2.89 4H14.5a.5.5 0 0 1 .485.621l-1.5 6A.5.5 0 0 1 13 11H4a.5.5 0 0 1-.485-.379L1.61 2H.5a.5.5 0 0 1-.5-.5zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z'/%3E%3C/svg%3E">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #007bff, #0056b3);
      font-family: Arial, sans-serif;
    }
    .form-signin {
      max-width: 400px;
      padding: 30px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(0,0,0,0.3);
      animation: fadeIn 0.8s ease-in-out;
      text-align: center;
    }
    .form-signin h1 {
      font-weight: bold;
      font-size: 1.8rem;
      color: #0056b3;
      margin-bottom: 5px;
    }
    .form-signin h5 {
      font-weight: normal;
      margin-bottom: 20px;
      color: #007bff;
    }
    .form-signin .btn-primary {
      background-color: #007bff;
      border: none;
    }
    .form-signin .btn-primary:hover {
      background-color: #0056b3;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="text-center">

  <main class="form-signin w-100 m-auto">
    <form onsubmit="login(event)">
      <h1>🛒 E-COMPRE</h1>
      <h5>Sistema de Estoque</h5>

      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="user" placeholder="Usuário">
        <label for="user">Usuário</label>
      </div>

      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="email" placeholder="email@exemplo.com">
        <label for="email">E-mail</label>
      </div>

      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="password" placeholder="Senha">
        <label for="password">Senha</label>
      </div>

      <button class="w-100 btn btn-lg btn-primary mb-2" type="submit">Entrar</button>
      <button class="w-100 btn btn-lg btn-success" type="button" onclick="criarConta()">Criar Conta</button>

      <p class="mt-4 mb-0 text-muted">&copy; 2025 E-COMPRE</p>
    </form>
  </main>

  <script>
    function login(event) {
      event.preventDefault(); // impede reload

      let usuario = document.getElementById("user").value.trim();
      let email = document.getElementById("email").value.trim();
      let senha = document.getElementById("password").value;

      if (usuario === "" || email === "" || senha === "") {
        alert("⚠️ Preencha todos os campos!");
        return;
      }

      // Recupera logins do localStorage
      let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

      // Verifica se existe usuário cadastrado
      let encontrado = usuarios.find(u => u.usuario === usuario && u.email === email && u.senha === senha);

      if (encontrado) {
        window.location.href = "sistemadeestoque.html";
      } else {
        alert("❌ Usuário, e-mail ou senha incorretos!");
      }
    }

    function criarConta() {
      let usuario = document.getElementById("user").value.trim();
      let email = document.getElementById("email").value.trim();
      let senha = document.getElementById("password").value;

      if (usuario === "" || email === "" || senha === "") {
        alert("⚠️ Preencha todos os campos para criar a conta!");
        return;
      }

      // Recupera usuários existentes
      let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

      // Verifica se já existe
      let existe = usuarios.find(u => u.usuario === usuario || u.email === email);
      if (existe) {
        alert("⚠️ Usuário ou e-mail já cadastrados!");
        return;
      }

      // Adiciona novo usuário
      usuarios.push({ usuario, email, senha });
      localStorage.setItem("usuarios", JSON.stringify(usuarios));

      alert("✅ Conta criada com sucesso! Agora você pode entrar.");
      document.getElementById("user").value = "";
      document.getElementById("email").value = "";
      document.getElementById("password").value = "";
    }
  </script>

</body>
</html>
