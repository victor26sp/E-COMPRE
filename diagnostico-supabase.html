<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Diagnóstico Supabase — E-COMPRE</title>
<link href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='%230d6efd' class='bi bi-cart' viewBox='0 0 16 16'%3E%3Cpath d='M0 1.5A.5.5 0 0 1 .5 1h1.11l.401 1.607L2.89 4H14.5a.5.5 0 0 1 .485.621l-1.5 6A.5.5 0 0 1 13 11H4a.5.5 0 0 1-.485-.379L1.61 2H.5a.5.5 0 0 1-.5-.5zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z'/%3E%3C/svg%3E" rel="icon"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: monospace; background:#0f0f13; color:#e0e0e0; padding:2rem; margin:0; }
  h1 { color:#6c8ef7; }
  .card { background:#1a1a24; border:1px solid #2e2e3a; border-radius:10px; padding:1.2rem; margin:1rem 0; }
  .ok   { color:#1db954; }
  .err  { color:#e74c3c; }
  .warn { color:#f39c12; }
  .info { color:#5dade2; }
  pre { background:#0a0a10; padding:.8rem; border-radius:6px; overflow-x:auto; font-size:13px; white-space:pre-wrap; }
  button { background:#6c8ef7; color:#fff; border:none; padding:.5rem 1.2rem; border-radius:6px; cursor:pointer; margin:.3rem; font-size:14px; }
  button:hover { background:#5a7de0; }
  input { background:#25252f; border:1px solid #3a3a4a; color:#e0e0e0; padding:.4rem .8rem; border-radius:6px; width:100%; box-sizing:border-box; margin:.3rem 0; font-family:monospace; }
  label { font-size:13px; color:#9090a8; }
  .badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:12px; margin:2px; }
  .badge-ok  { background:#1a3a2a; color:#1db954; border:1px solid #1db954; }
  .badge-err { background:#3a1a1a; color:#e74c3c; border:1px solid #e74c3c; }
  #log { max-height:500px; overflow-y:auto; }
</style>
</head>
<body>
<h1>🔬 Diagnóstico Supabase — E-COMPRE</h1>

<div class="card">
  <label>Project URL</label>
  <input id="inUrl" placeholder="https://xxxx.supabase.co"/>
  <label>Anon Key</label>
  <input id="inKey" type="password" placeholder="eyJ..."/>
  <button onclick="iniciar()">▶ Iniciar Diagnóstico Completo</button>
  <button onclick="testarInsertMovimento()">🧪 Testar Insert Movimento</button>
  <button onclick="contarDados()">📊 Contar Dados no Banco</button>
  <button onclick="limparLog()">🗑 Limpar Log</button>
  <button onclick="importarSoMovimentos()" style="background:#e74c3c">🔧 Inserir só os movimentos faltando</button>
  <button onclick="verificacaoCompleta()" style="background:#1db954">✅ Verificação Completa (paginada)</button>
</div>

<div class="card" id="resumo" style="display:none">
  <strong>Resumo:</strong> <span id="resumoTxt"></span>
</div>

<div class="card">
  <div id="log"></div>
</div>

<script>
let sb = null;
const log = document.getElementById('log');

function L(msg, tipo='info') {
  const colors = {ok:'#1db954',err:'#e74c3c',warn:'#f39c12',info:'#5dade2',dim:'#666'};
  const icons  = {ok:'✅',err:'❌',warn:'⚠️',info:'ℹ️',dim:'·'};
  const el = document.createElement('div');
  el.style.cssText = `color:${colors[tipo]||'#e0e0e0'};margin:2px 0;font-size:13px`;
  el.textContent = `${icons[tipo]||'>'} ${msg}`;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function Lpre(obj) {
  const el = document.createElement('pre');
  el.textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
  el.style.fontSize = '12px';
  log.appendChild(el);
}

function limparLog() { log.innerHTML = ''; }

function getSb() {
  const url = document.getElementById('inUrl').value.trim().replace(/\/$/,'');
  const key = document.getElementById('inKey').value.trim();
  if (!url || !key) { L('Preencha URL e Anon Key','err'); return null; }
  return window.supabase.createClient(url, key);
}

async function iniciar() {
  limparLog();
  sb = getSb(); if (!sb) return;
  L('=== DIAGNÓSTICO COMPLETO ===','info');

  // 1. Ping
  L('1. Testando conexão...','info');
  const { data: ping, error: pe } = await sb.from('produtos').select('id').limit(1);
  if (pe) { L(`Conexão FALHOU: [${pe.code}] ${pe.message}`,'err'); return; }
  L('Conexão OK','ok');

  // 2. Verifica colunas de movimentos
  L('2. Verificando colunas da tabela movimentos...','info');
  const { data: movSample } = await sb.from('movimentos').select('*').limit(1);
  if (movSample && movSample.length) {
    const cols = Object.keys(movSample[0]);
    L(`Colunas: ${cols.join(', ')}`, 'ok');
    const temVu = cols.includes('valor_unit');
    L(`valor_unit existe: ${temVu}`, temVu ? 'ok' : 'err');
  } else {
    L('Tabela movimentos vazia — testando insert...','warn');
  }

  // 3. Conta registros
  await contarDados();

  // 4. Testa insert de produto
  L('4. Testando insert de produto...','info');
  const { data: dProd, error: eProd } = await sb
    .from('produtos')
    .insert({ codigo:'__DIAG_TESTE__', nome:'Diagnóstico Teste', estoque_inicial:0 })
    .select('id').single();
  if (eProd) {
    L(`Insert produto FALHOU: [${eProd.code}] ${eProd.message}`,'err');
    Lpre(eProd);
    return;
  }
  L(`Insert produto OK — id=${dProd.id}`,'ok');

  // 5. Testa insert movimento SEM valor_unit
  L('5. Testando insert movimento (sem valor_unit)...','info');
  const { data: dMov1, error: eMov1 } = await sb
    .from('movimentos')
    .insert({ tipo:'entrada', produto:'__DIAG_TESTE__', quantidade:1, data:'2026-06-21', obs:'DIAG' })
    .select('id').single();
  if (eMov1) { L(`FALHOU: [${eMov1.code}] ${eMov1.message}`,'err'); Lpre(eMov1); }
  else        { L(`OK — id=${dMov1.id}`,'ok'); }

  // 6. Testa insert movimento COM valor_unit
  L('6. Testando insert movimento (com valor_unit=92)...','info');
  const { data: dMov2, error: eMov2 } = await sb
    .from('movimentos')
    .insert({ tipo:'saida', produto:'__DIAG_TESTE__', quantidade:1, data:'2026-06-21',
              loja:null, obs:'DIAG VU', tabela_preco:'empresa', valor_unit:92 })
    .select('id').single();
  if (eMov2) { L(`FALHOU: [${eMov2.code}] ${eMov2.message}`,'err'); Lpre(eMov2); }
  else        { L(`OK com valor_unit — id=${dMov2.id}`,'ok'); }

  // 7. Testa insert minuta
  L('7. Testando insert minuta...','info');
  const { error: eMin } = await sb.from('minutas').insert({
    id: 'm_diag_'+Date.now(), data:'2026-06-21', hora:'14:00',
    tipo:'agencia_mercadolivre', obs:'DIAG', packs:{}, produtos:[]
  });
  if (eMin) { L(`Minuta FALHOU: [${eMin.code}] ${eMin.message}`,'err'); Lpre(eMin); }
  else       { L('Minuta OK','ok'); }

  // 8. Testa insert sku_memory
  L('8. Testando insert sku_memory...','info');
  const { error: eSku } = await sb.from('sku_memory').upsert(
    { sku:'SKU_DIAG_TESTE', prod_codigo:'__DIAG_TESTE__', updated_at: new Date().toISOString() },
    { onConflict:'sku' }
  );
  if (eSku) { L(`sku_memory FALHOU: [${eSku.code}] ${eSku.message}`,'err'); }
  else       { L('sku_memory OK','ok'); }

  // Limpa dados de teste
  L('Limpando dados de teste...','dim');
  await sb.from('movimentos').delete().eq('obs','DIAG');
  await sb.from('movimentos').delete().eq('obs','DIAG VU');
  await sb.from('minutas').delete().like('id','m_diag_%');
  await sb.from('sku_memory').delete().eq('sku','SKU_DIAG_TESTE');
  await sb.from('produtos').delete().eq('codigo','__DIAG_TESTE__');

  L('=== DIAGNÓSTICO CONCLUÍDO ===','ok');
}

async function testarInsertMovimento() {
  sb = getSb(); if (!sb) return;
  L('--- Teste de insert de movimento real ---','info');

  // Pega primeiro produto do banco
  const { data: prods } = await sb.from('produtos').select('codigo').limit(1);
  if (!prods || !prods.length) { L('Nenhum produto no banco','err'); return; }
  const cod = prods[0].codigo;
  L(`Usando produto: ${cod}`,'info');

  const row = {
    tipo: 'entrada', produto: cod, quantidade: 1,
    data: new Date().toISOString().slice(0,10), obs: 'TESTE_DIRETO'
  };
  const { data, error } = await sb.from('movimentos').insert(row).select('id').single();
  if (error) { L(`FALHOU: [${error.code}] ${error.message}`,'err'); Lpre(error); }
  else {
    L(`OK — movimento inserido id=${data.id}`,'ok');
    // Remove
    await sb.from('movimentos').delete().eq('id', data.id);
    L('Movimento de teste removido','dim');
  }
}

async function contarDados() {
  sb = getSb(); if (!sb) return;
  L('3. Contando dados no banco...','info');
  const tabelas = ['produtos','lojas','movimentos','minutas','ncm','price_tables','alocacoes','sku_memory','system_users'];
  let resumo = [];
  for (const tbl of tabelas) {
    const { data, error } = await sb.from(tbl).select('*', { count:'exact', head:true });
    // A contagem vem no header — tentamos outro modo
    const { data: d2 } = await sb.from(tbl).select('id').limit(1000);
    const count = d2 ? d2.length : '?';
    const sufixo = d2 && d2.length === 1000 ? '≥1000' : count;
    L(`  ${tbl}: ${sufixo}`, sufixo > 0 ? 'ok' : 'warn');
    resumo.push(`${tbl}:${sufixo}`);
  }

  // Movimentos por data — pagina para pegar todos (Supabase limite 1000/req)
  let allMovDatas = [], from = 0, pageSize = 1000;
  while (true) {
    const { data: page, error: pe } = await sb.from('movimentos')
      .select('data').order('data').range(from, from + pageSize - 1);
    if (pe || !page || !page.length) break;
    allMovDatas = allMovDatas.concat(page);
    if (page.length < pageSize) break;
    from += pageSize;
  }
  L(`  Total real de movimentos: ${allMovDatas.length}`, allMovDatas.length > 0 ? 'ok' : 'warn');
  if (allMovDatas.length) {
    const cnt = {};
    allMovDatas.forEach(r => { cnt[r.data] = (cnt[r.data]||0)+1; });
    L('  Movimentos por data:','info');
    Object.keys(cnt).sort().forEach(d => L(`    ${d}: ${cnt[d]}`,'dim'));
    const datas = Object.keys(cnt).sort();
    L(`  Período: ${datas[0]} → ${datas[datas.length-1]}`,'ok');
    L(`  Total de datas distintas: ${datas.length}`,'ok');
    // Alerta se faltar dados esperados
    const ultimaData = datas[datas.length-1];
    if (ultimaData < '2026-06-19') {
      L(`  ⚠️ ATENÇÃO: Dados faltando! Último registro: ${ultimaData} (backup vai até 2026-06-19)`,'err');
    }
  }
}

async function importarSoMovimentos() {
  sb = getSb(); if (!sb) return;
  L('--- Inserindo movimentos faltando (a partir de 2026-06-11) ---','warn');

  // Dados do backup embutidos para inserção direta
  // Cole aqui o JSON do backup ou use o input abaixo
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    const data = JSON.parse(await file.text());
    const movs = (data.movimentos || data.movs || []);
    const prods = new Set((data.produtos || data.prods || []).map(p => p.codigo));
    const lojas = new Set((data.lojas || []).map(l => l.codigo));

    // Descobre quais datas já estão no banco
    L(`Verificando datas já no banco...`,'info');
    let noBank = new Set(), from2 = 0;
    while (true) {
      const { data: page } = await sb.from('movimentos').select('data').range(from2, from2+999);
      if (!page || !page.length) break;
      page.forEach(r => noBank.add(r.data));
      if (page.length < 1000) break;
      from2 += 1000;
    }
    L(`Datas no banco: ${[...noBank].sort().join(', ')}`,'dim');

    // Filtra só movimentos que não estão no banco
    const faltando = movs.filter(m =>
      m.data && !noBank.has(m.data) &&
      m.tipo && m.produto && m.quantidade &&
      prods.has(m.produto)
    ).map(m => ({
      tipo:         String(m.tipo),
      produto:      String(m.produto),
      quantidade:   Number(m.quantidade),
      data:         String(m.data),
      loja:         (m.loja && lojas.has(String(m.loja))) ? String(m.loja) : null,
      obs:          String(m.obs||''),
      tabela_preco: String(m.tabelaPreco||m.tabela_preco||''),
      valor_unit:   Number(m.valorUnit||m.valor_unit||0)
    })).sort((a,b) => a.data.localeCompare(b.data));

    L(`Movimentos faltando para inserir: ${faltando.length}`,'warn');
    if (!faltando.length) { L('Nenhum movimento faltando!','ok'); return; }

    const datas_f = [...new Set(faltando.map(m => m.data))].sort();
    L(`Datas a inserir: ${datas_f.join(', ')}`,'info');

    let ok = 0, erros = 0;
    for (let i = 0; i < faltando.length; i += 50) {
      const chunk = faltando.slice(i, i+50);
      const { error } = await sb.from('movimentos').insert(chunk);
      if (!error) { ok += chunk.length; }
      else {
        L(`Chunk ${i} erro: [${error.code}] ${error.message}`,'err');
        // linha a linha
        for (const row of chunk) {
          const { error: re } = await sb.from('movimentos').insert(row);
          if (!re) ok++;
          else { erros++; L(`  Linha ignorada [${re.code}]: ${JSON.stringify(row).slice(0,100)}`,'err'); }
        }
      }
      if (i % 200 === 0) L(`  Progresso: ${Math.min(i+50, faltando.length)}/${faltando.length}`,'dim');
    }
    L(`Concluído: ${ok} inseridos, ${erros} erros`,'ok');
    await contarDados();
  };
  input.click();
}

async function verificacaoCompleta() {
  sb = getSb(); if (!sb) return;
  limparLog();
  L('=== VERIFICAÇÃO COMPLETA COM PAGINAÇÃO ===','info');

  // Conta total real de cada tabela com paginação
  const tabelas = {
    movimentos: false, produtos: false, lojas: false,
    minutas: true, price_tables: false, alocacoes: false,
    ncm: false, sku_memory: true, system_users: false
  };

  // PK de cada tabela (sku_memory usa 'sku', não 'id')
  const pkMap = { sku_memory: 'sku', config: 'chave' };
  for (const [tbl, isText] of Object.entries(tabelas)) {
    const pk = pkMap[tbl] || 'id';
    let total = 0, from = 0;
    while (true) {
      const { data, error } = await sb.from(tbl).select(pk).range(from, from + 999);
      if (error || !data) { L(`${tbl}: erro — ${error?.message||'desconhecido'}`,'err'); break; }
      total += data.length;
      if (data.length < 1000) break;
      from += 1000;
    }
    L(`${tbl}: ${total} registros`, total > 0 ? 'ok' : 'warn');
  }

  // Movimentos por data (paginado)
  L('','dim');
  L('Movimentos por data (todos):','info');
  let allDatas = [], from2 = 0;
  while (true) {
    const { data } = await sb.from('movimentos').select('data').order('data').range(from2, from2+999);
    if (!data || !data.length) break;
    allDatas = allDatas.concat(data);
    if (data.length < 1000) break;
    from2 += 1000;
  }

  const cnt = {};
  allDatas.forEach(r => { cnt[r.data] = (cnt[r.data]||0)+1; });
  let totalMovs = 0;
  Object.keys(cnt).sort().forEach(d => {
    L(`  ${d}: ${cnt[d]}`,'dim');
    totalMovs += cnt[d];
  });
  const datas = Object.keys(cnt).sort();
  L(`Total de movimentos: ${totalMovs}`,'ok');
  L(`Período: ${datas[0]} → ${datas[datas.length-1]}`,'ok');
  L(`Datas distintas: ${datas.length}`,'ok');

  if (totalMovs >= 1955) {
    L('✓ TODOS OS 1955 MOVIMENTOS ESTÃO NO BANCO!','ok');
  } else {
    L(`⚠️ Faltam ${1955 - totalMovs} movimentos no banco`,'err');
  }
}

// Preenche automaticamente se encontrar no localStorage
window.onload = () => {
  const url = localStorage.getItem('ec_sb_url') || '';
  const key = localStorage.getItem('ec_sb_key') || '';
  if (url) document.getElementById('inUrl').value = url;
  if (key) document.getElementById('inKey').value = key;
  if (url && key) L('Credenciais carregadas do localStorage do E-COMPRE','ok');
};
</script>
</body>
</html>
